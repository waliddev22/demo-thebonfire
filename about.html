<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/style.css" rel="stylesheet">
  <title>The Bonfire Restaurant</title>
</head>

<body class="min-h-screen flex flex-col container mx-auto px-4">

  <header>
    <nav class="w-full py-2">
      <div class="flex justify-between items-center flex-wrap gap-y-3">

        <div class="hidden md:flex md:flex-col gap-1 flex-1 text-sm">
          <p class="flex items-center gap-1">
            <img id="hours-icon" src="src/assets/icons/schedule.svg" class="w-4" alt="Hours icon" />
            <span class="font-bold">Today's Hours</span>: From 3 PM to 11:00 PM
          </p>
          <p class="flex items-center gap-1">
            <img id="location-icon" src="src/assets/icons/location.svg" class="w-4" alt="Location icon" />
            2394 Robie St, Halifax, NS B3K 4M7, Canada
          </p>
          <a class="flex items-center gap-1" href="tel:+19024743076">
            <img id="call-icon" src="src/assets/icons/call.svg" class="w-4" alt="Call icon" />
            +1 902-474-3076
          </a>
        </div>

        <div class="mx-auto md:mx-0">
          <a href="/">
            <img id="logo" src="src/assets/logo/the-bonefire-logo.avif" class="w-40 md:w-70"
              alt="The Bonefire Restaurant Logo" />
          </a>
        </div>


        <div class="hidden md:flex gap-x-2 flex-1 justify-end items-center">
          <button
            class="relative inline-flex px-10 py-2 text-lg border-2 border-[#3F2A1D] hover:border-red-700 [clip-path:polygon(10%_0%,_100%_0%,_100%_90%,_90%_100%,_0%_100%,_0%_10%)]">
            <span
              class="absolute inset-0 bg-[#31272a] hover:bg-[#30161e] [clip-path:polygon(10%_0%,_100%_0%,_100%_90%,_90%_100%,_0%_100%,_0%_10%)]"></span>
            <span class="relative z-10 text-[#f6c798]">
              ORDER NOW
            </span>
          </button>
        </div>

        <button id="menu-toggle" class="md:hidden p-2" aria-label="Toggle menu" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

      <ul id="nav-links"
        class="hidden md:flex flex-col md:flex-row md:items-center gap-x-7 gap-y-2 mt-4 md:mt-8 text-[#3F2A1D] justify-center">
        <li><a href="/index" data-path="/index" class="nav-link hover:text-[#a75624] px-2 py-1 transition">HOME</a></li>
        <li><a href="/menu" data-path="/menu" class="nav-link hover:text-[#a75624] px-2 py-1 transition">MENU</a></li>
        <li><a href="/catering" data-path="/catering"
            class="nav-link hover:text-[#a75624] px-2 py-1 transition">CATERING</a></li>
        <li><a href="/events" data-path="/reservation"
            class="nav-link hover:text-[#a75624] px-2 py-1 transition">RESERVATION & EVENTS</a></li>
        <li><a href="/location" data-path="/location"
            class="nav-link hover:text-[#a75624] px-2 py-1 transition">LOCATION & HOURS</a></li>
        <li><a href="/about" data-path="/about" class="nav-link hover:text-[#a75624] px-2 py-1 transition">ABOUT US</a>
        </li>
        <li><a href="/contact" data-path="/contact" class="nav-link hover:text-[#a75624] px-2 py-1 transition">CONTACT
            US</a></li>
        <li><a href="/blog" data-path="/blog" class="nav-link hover:text-[#a75624] px-2 py-1 transition">BLOG</a></li>
        <li class="md:hidden pt-2">
          <a href="/order"
            class="block text-center bg-[#a75624] hover:bg-[#8a4519] text-white text-sm font-bold px-5 py-2 rounded transition">
            ORDER NOW
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <a href="/menu.html">Menu</a>
    <a href="/blog.html">blog</a>
  </main>

  <footer></footer>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
